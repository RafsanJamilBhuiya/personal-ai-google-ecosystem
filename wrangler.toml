name = "personal-ai-google-ecosystem"
main = "backend/worker.js"
compatibility_date = "2026-09-13"
workers_dev = true

[vars]
APP_ENV = "production"
FRONTEND_ORIGIN = "*"

# Create this KV namespace in Cloudflare and replace the placeholder ID before deploy.
[[kv_namespaces]]
binding = "OAUTH_TOKEN_STORE"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
