name = "personal-ai-google-ecosystem"
main = "backend/worker.js"
compatibility_date = "2026-09-13"
workers_dev = true

[vars]
APP_ENV = "production"
FRONTEND_ORIGIN = "https://rafsanjamilbhuiya.github.io/personal-ai-google-ecosystem"

[[kv_namespaces]]
binding = "OAUTH_TOKEN_STORE"

[secrets]
required = [
  "OAUTH_STATE_SECRET",
  "OAUTH_TOKEN_ENCRYPTION_KEY",
  "GOOGLE_OAUTH_CLIENT_ID",
  "GOOGLE_OAUTH_CLIENT_SECRET",
  "GOOGLE_OAUTH_REDIRECT_URI",
  "GOOGLE_SHEETS_DATABASE_ID",
  "ADMIN_GOOGLE_EMAIL",
  "TELEGRAM_BOT_TOKEN",
  "TELEGRAM_CHAT_ID"
]
