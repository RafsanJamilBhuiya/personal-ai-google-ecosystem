name = "personal-ai-google-ecosystem"
main = "backend/worker.js"
compatibility_date = "2026-09-13"
workers_dev = true

[vars]
APP_ENV = "production"
# Set this to the exact deployed frontend origin before production use.
FRONTEND_ORIGIN = ""

# Google OAuth token storage is configured after the target Cloudflare KV
# namespace exists. Add the binding below with the real namespace ID before
# enabling live Google OAuth persistence.
#
# [[kv_namespaces]]
# binding = "OAUTH_TOKEN_STORE"
# id = "<REAL_KV_NAMESPACE_ID>"
