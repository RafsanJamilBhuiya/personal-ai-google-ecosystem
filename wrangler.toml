name = "personal-ai-google-ecosystem"
main = "backend/worker.js"
compatibility_date = "2026-09-13"
workers_dev = true

[vars]
APP_ENV = "production"
FRONTEND_ORIGIN = "https://rafsanjamilbhuiya.github.io/personal-ai-google-ecosystem"

# Google OAuth token persistence uses encrypted Cloudflare KV.
# The real namespace ID is bound in the deployment environment.
#
# [[kv_namespaces]]
# binding = "OAUTH_TOKEN_STORE"
# id = "<REAL_KV_NAMESPACE_ID>"
