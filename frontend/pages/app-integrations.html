<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>App Integrations · Personal AI</title><link rel="stylesheet" href="../css/app.css"></head><body><header><a href="../index.html">Personal AI</a><nav><a href="./dashboard.html">Dashboard</a><a href="./chat.html">Chat</a><a href="./tasks.html">Tasks</a><a href="./admin-profile.html">Admin Profile</a></nav></header><main><section><div class="dashboard-head"><div><p class="eyebrow">ADMIN</p><h1>App Integrations / Plugins</h1><p>Manage the platforms used by the Personal AI + Google Ecosystem.</p></div><a class="button secondary" href="./admin-profile.html">Admin Profile</a></div><div id="integration-grid" class="integration-grid"><div class="panel">Loading integration status…</div></div><p id="integration-error" class="notice" hidden></p></section></main><script type="module">import {api} from '../js/api.js';import {requireAdmin} from '../js/auth-guard.js';await requireAdmin();const grid=document.querySelector('#integration-grid'),error=document.querySelector('#integration-error'),labels={connected:'Connected',configured:'Configured',not_configured:'Not configured',error:'Error'};function card(i){return `<article class="panel integration-card"><div class="panel-head"><div><p class="eyebrow">${i.category}</p><h2>${i.name}</h2></div><strong class="status-badge ${i.status}">${labels[i.status]||i.status}</strong></div><p><b>Authentication:</b> ${i.auth}</p><div class="service-tags">${i.services.map(s=>`<span>${s}</span>`).join('')}</div><div class="integration-actions">${i.id==='google'?'<a class="button" href="./google-setup.html">Open Google Setup</a>':'<span class="muted">Configuration managed by backend</span>'}</div></article>`}api('/api/admin/integrations').then(d=>grid.innerHTML=d.integrations.map(card).join('')).catch(e=>{grid.innerHTML='';error.hidden=false;error.textContent=e.message||'Unable to load integration status.';});</script></body></html>
