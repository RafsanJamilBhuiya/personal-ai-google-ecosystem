<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>App Integrations · Personal AI</title><link rel="stylesheet" href="../css/app.css"></head>
<body><header><a href="../index.html">Personal AI</a><nav><a href="./dashboard.html">Dashboard</a><a href="./chat.html">Chat</a><a href="./tasks.html">Tasks</a><a href="./admin-profile.html">Admin Profile</a></nav></header>
<main><section><div class="dashboard-head"><div><p class="eyebrow">ADMIN</p><h1>App Integrations / Plugins</h1><p>Manage the platforms used by the Personal AI + Google Ecosystem.</p></div><a class="button secondary" href="./admin-profile.html">Admin Profile</a></div><div id="integration-grid" class="integration-grid"><div class="panel">Loading integration status…</div></div><p id="integration-error" class="notice" hidden></p></section></main>
<script type="module">
import { api } from '../js/api.js';
const grid=document.querySelector('#integration-grid'), error=document.querySelector('#integration-error');
const labels={connected:'Connected',configured:'Configured',not_configured:'Not configured',error:'Error'};
function card(item){const services=item.services.map(s=>`<span>${s}</span>`).join('');return `<article class="panel integration-card"><div class="panel-head"><div><p class="eyebrow">${item.category}</p><h2>${item.name}</h2></div><strong class="status-badge ${item.status}">${labels[item.status]||item.status}</strong></div><p><b>Authentication:</b> ${item.auth}</p><div class="service-tags">${services}</div><div class="integration-actions"><button class="secondary" data-id="${item.id}" ${item.id==='google'?'':'disabled'}>${item.id==='google'?'Open Google Setup':'Coming with configuration'}</button></div></article>`}
api('/api/admin/integrations').then(data=>{grid.innerHTML=data.integrations.map(card).join('');grid.querySelectorAll('button[data-id="google"]').forEach(b=>b.onclick=()=>location.href='./google-setup.html');}).catch(e=>{grid.innerHTML='';error.hidden=false;error.textContent=e.message||'Unable to load integration status.';});
</script></body></html>
