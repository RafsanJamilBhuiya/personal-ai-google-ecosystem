<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Google Integration</title><link rel="stylesheet" href="../css/app.css"></head>
<body><main><section><h1>Google Integration</h1><div class="panel"><p id="state">Loading integration status…</p><p><a class="button" href="../../api/google/auth/url">Start Google authorization</a></p><p>After authorization, return here and initialize the Personal AI System Database.</p><button id="db" type="button">Initialize Database</button></div><div class="panel"><h2>Configured services</h2><ul id="services"><li>Loading…</li></ul></div></section></main><script type="module">
import { api } from '../js/api.js';
const state=document.querySelector('#state'), list=document.querySelector('#services'), db=document.querySelector('#db');
async function refresh(){try{const r=await api('/api/google/setup/status');state.textContent=r.auth?.connected?'Google authorization is connected.':'Google authorization is not connected.';list.replaceChildren(...(r.services||[]).map(s=>{const li=document.createElement('li');li.textContent=`${s.name||s.id}: ${s.enabled?'enabled':'disabled'} (${s.status||'unknown'})`;return li;}));}catch(e){state.textContent=e.message||'Worker unavailable.';}}
db.addEventListener('click',async()=>{db.disabled=true;try{const r=await api('/api/google/database/initialize',{method:'POST',body:'{}'});state.textContent=`Database initialized: ${r.result?.spreadsheetId||'configured spreadsheet'}.`;}catch(e){state.textContent=e.message||'Database initialization failed.';db.disabled=false;}});refresh();
</script></body></html>
