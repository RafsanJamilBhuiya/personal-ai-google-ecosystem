name: Live Verification

on:
  workflow_dispatch:
    inputs:
      worker_url:
        description: "Deployed Cloudflare Worker URL"
        required: true
        type: string
      frontend_url:
        description: "Published GitHub Pages URL"
        required: false
        default: "https://rafsanjamilbhuiya.github.io/personal-ai-google-ecosystem/"
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check
      - run: npm test
      - name: Verify live deployment
        env:
          LIVE_WORKER_URL: ${{ inputs.worker_url }}
          LIVE_FRONTEND_URL: ${{ inputs.frontend_url }}
        run: npm run live:verify
