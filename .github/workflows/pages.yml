name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build frontend
        env:
          WORKER_URL: ${{ vars.PERSONAL_AI_WORKER_URL }}
        run: |
          set -e
          mkdir -p _site
          cp -R frontend/. _site/
          touch _site/.nojekyll
          printf '%s\n' "window.PERSONAL_AI_WORKER_URL = ${WORKER_URL:+\"$WORKER_URL\"};" > _site/js/runtime-config.js
          if [ -z "$WORKER_URL" ]; then
            echo 'Worker URL is not configured; frontend will run in disconnected mode.'
            printf '%s\n' 'window.PERSONAL_AI_WORKER_URL = "";' > _site/js/runtime-config.js
          fi
          for page in $(find _site/pages -type f -name '*.html' ! -name 'login.html'); do
            python - "$page" <<'PY'
import pathlib, sys
p=pathlib.Path(sys.argv[1])
s=p.read_text()
marker='<script type="module" src="../js/admin-bootstrap.js"></script>'
if marker not in s:
    s=s.replace('</body>', marker+'\n</body>')
    p.write_text(s)
PY
          done
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
